name: Codzienne Wyszukiwanie Tematów i Publikacja (Blog Laika)

on:
  schedule:
    # Codziennie o 05:00 UTC (06:00 / 07:00 rano czasu polskiego)
    - cron: '0 5 * * *'
  workflow_dispatch: # Uruchomienie ręczne na żądanie z panelu Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-proposals"
  cancel-in-progress: false

jobs:
  update-proposals:
    runs-on: ubuntu-latest
    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Konfiguracja Pythona 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalacja zależności
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchomienie generatora propozycji (Samokreacja + Rotacja 7 dni)
        run: |
          python scripts/generate_proposals.py

      - name: Kompilacja statyczna serwisu
        run: |
          python export_static.py

      - name: Zapisanie zmian w gałęzi main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add propozycje-tematow/
          git commit -m "chore(auto): codzienne automatyczne wyszukanie propozycji tematów AI [skip ci]" || echo "Brak nowych zmian w propozycjach"
          git push origin main || echo "Push skipped"

      - name: Wdrożenie na GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

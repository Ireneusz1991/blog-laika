name: Codzienny Scraper RSS i Cron Redakcyjny (08:00)

on:
  schedule:
    # 07:00 UTC = 08:00 czasu polskiego (CET)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Wymuś świeży skan kanałów RSS i nadpisanie dzisiejszego zestawu'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: "blog-laika-cron-deploy"
  cancel-in-progress: false

jobs:
  daily-rss-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Konfiguracja Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Skanowanie żywych kanałów RSS i generowanie 6 propozycji (+ Kondensat)
        env:
          TZ: 'Europe/Warsaw'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "false" ]; then
            python scripts/daily_editorial_cron.py --trigger-label "Ręczny Cron z Chmury GitHub"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/daily_editorial_cron.py --force --trigger-label "Ręczny Cron z Chmury GitHub (z palca)"
          else
            python scripts/daily_editorial_cron.py --force --trigger-label "Automatyczny Cron 08:00 (GitHub Cloud)"
          fi

      - name: Kompilacja statyczna bloga i panelu CMS (dist/)
        env:
          TZ: 'Europe/Warsaw'
        run: |
          python export_static.py

      - name: Zapisanie świeżych propozycji i rejestru anty-duplikatów na gałęzi main
        run: |
          git config user.name "Blog Laika Cron Bot"
          git config user.email "kontakt@blog-laika.com"
          git add propozycje-tematow/ data/
          if ! git diff --staged --quiet; then
            git commit -m "Automatyczna aktualizacja Banku Tematów i RSS ($(date +'%Y-%m-%d %H:%M')) [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Brak zmian w plikach propozycji do zapisania na main."
          fi

      - name: Publikacja wygenerowanej strony (dist/) na gałąź gh-pages (blog-laika.com)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TMP_DEPLOY=$(mktemp -d)
          cp -r dist/. "$TMP_DEPLOY/"
          cd "$TMP_DEPLOY"
          git init -b gh-pages
          git config user.name "Blog Laika Cron Bot"
          git config user.email "kontakt@blog-laika.com"
          git add -A
          git commit -m "Wdrożenie Crona Redakcyjnego ($(date +'%Y-%m-%d %H:%M'))"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin gh-pages --force

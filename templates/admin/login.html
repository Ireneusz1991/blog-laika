{% extends "base.html" %}

{% block title %}Logowanie do CMS | {{ blog_title }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 440px; margin-top: 2rem;">
  <div style="background: var(--bg-card); padding: 2.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-md);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <img src="/static/images/logo.svg" alt="Blog Laika" style="height: 48px; margin-bottom: 1rem;">
      <h2 style="font-size: 1.5rem; font-weight: 700;">Panel Autorski (CMS)</h2>
      <p style="font-size: 0.9rem; color: var(--text-muted);">Zaloguj się, aby zarządzać esejami</p>
    </div>

    {% if error %}
    <div style="background: #fee2e2; border: 1px solid #f87171; color: #b91c1c; padding: 0.75rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem; font-size: 0.9rem;">
      {{ error }}
    </div>
    {% endif %}

    <form action="/admin/login" method="post" id="dynamic-login-form">
      <div class="form-group" style="margin-bottom: 1.1rem;">
        <label class="form-label" for="username">Nazwa użytkownika</label>
        <input class="form-input" type="text" id="username" name="username" required autofocus placeholder="admin" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      </div>

      <div class="form-group" style="margin-bottom: 1.1rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
          <label class="form-label" for="password" style="margin: 0;">Hasło</label>
          <button type="button" onclick="toggleLocalPwd();" style="background: none; border: none; font-size: 0.78rem; color: var(--accent); cursor: pointer; text-decoration: underline; padding: 0;">
            <span id="local-pwd-text">Pokaż hasło</span>
          </button>
        </div>
        <div style="position: relative;">
          <input class="form-input" type="password" id="password" name="password" required placeholder="laik2026" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" style="padding-right: 2.5rem;">
          <button type="button" onclick="toggleLocalPwd();" style="position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.05rem; opacity: 0.75;" id="local-pwd-icon">
            👁️
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; margin-top: 0.75rem; font-weight: 700;">
        Zaloguj się do panelu &rarr;
      </button>

      <button type="button" onclick="quickFillLocal();" class="btn btn-secondary" style="width: 100%; justify-content: center; padding: 0.65rem; margin-top: 0.6rem; font-size: 0.85rem; font-weight: 600; border: 1.5px dashed var(--accent); background: var(--bg-surface);">
        ⚡ Wypełnij i wyślij automatycznie
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.82rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 1rem; line-height: 1.6;">
      Domyślne dane dostępowe:<br>
      Login: <code style="cursor: pointer;" onclick="document.getElementById('username').value='admin'; document.getElementById('password').focus();">admin</code> | 
      Hasło: <code style="cursor: pointer;" onclick="document.getElementById('password').value='laik2026';">laik2026</code>
    </div>

    <script>
      function toggleLocalPwd() {
        const p = document.getElementById('password');
        const icon = document.getElementById('local-pwd-icon');
        const txt = document.getElementById('local-pwd-text');
        if (p.type === 'password') {
          p.type = 'text';
          if (icon) icon.textContent = '🙈';
          if (txt) txt.textContent = 'Ukryj hasło';
        } else {
          p.type = 'password';
          if (icon) icon.textContent = '👁️';
          if (txt) txt.textContent = 'Pokaż hasło';
        }
      }

      function quickFillLocal() {
        document.getElementById('username').value = 'admin';
        document.getElementById('password').value = 'laik2026';
        document.getElementById('dynamic-login-form').submit();
      }
    </script>

  </div>
</div>
{% endblock %}

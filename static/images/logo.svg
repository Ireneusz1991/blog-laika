<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 80" width="100%" height="100%">
  <defs>
    <style>
      .logo-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
      .logo-sub { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 1.8px; text-transform: uppercase; }
      @media (prefers-color-scheme: dark) {
        .logo-title { fill: #f8fafc; }
        .logo-sub { fill: #94a3b8; }
      }
    </style>
    <linearGradient id="laikaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="url(#laikaGrad)" />
    <path d="M 30 14 L 38 34 L 30 46 L 22 34 Z" fill="#ffffff" />
    <line x1="30" y1="22" x2="30" y2="44" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
    <circle cx="30" cy="30" r="2.2" fill="#2563eb" />
    <circle cx="43" cy="18" r="4" fill="url(#starGrad)" />
    <path d="M 17 38 A 16 16 0 0 1 43 25" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.8" />
  </g>

  <!-- Typography -->
  <g transform="translate(85, 20)">
    <text x="0" y="27" class="logo-title">BLOG LAIKA</text>
    <text x="1" y="46" class="logo-sub">Technologia • Gospodarka • Polityka</text>
  </g>
</svg>
